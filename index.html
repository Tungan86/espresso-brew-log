<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espresso Brew Log | 義式咖啡沖煮紀錄</title>
  <!-- Google Fonts: Outfit for headers, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c1816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Espresso Log">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="logo">
          <svg class="icon-coffee" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
            <line x1="6" y1="2" x2="6" y2="4" />
            <line x1="10" y1="2" x2="10" y2="4" />
            <line x1="14" y1="2" x2="14" y2="4" />
          </svg>
          <h1>Espresso Brew Log</h1>
        </div>
        <div class="header-actions">
          <button id="btn-export" class="btn btn-secondary btn-sm" title="備份資料為 JSON 檔案">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            備份
          </button>
          <button id="btn-import-trigger" class="btn btn-secondary btn-sm" title="從 JSON 檔案還原資料">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            還原
          </button>
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Left Column: Dashboard & Inventory -->
      <div class="main-column column-left">
        <!-- Dashboard Stats -->
        <section class="card stats-card" aria-labelledby="stats-title">
          <h2 id="stats-title" class="section-title">數據統計</h2>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">總沖煮次數</span>
              <span id="stat-total-brews" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">平均評分</span>
              <span id="stat-avg-rating" class="stat-value">0.0 <span class="star-mini">★</span></span>
            </div>
            <div class="stat-item">
              <span class="stat-label">現役豆種</span>
              <span id="stat-active-beans" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">平均萃取時間</span>
              <span id="stat-avg-time" class="stat-value">0.0s</span>
            </div>
          </div>
          
          <!-- Visual Chart Container -->
          <div class="chart-container">
            <h3 class="chart-title">近期沖煮時間與評分趨勢</h3>
            <div id="trend-chart" class="svg-chart-wrapper">
              <!-- SVG chart will be injected here -->
            </div>
          </div>
        </section>

        <!-- Stopwatch assistant -->
        <section class="card stopwatch-card" aria-labelledby="timer-title">
          <h2 id="timer-title" class="section-title">沖煮計時助理</h2>
          <div class="stopwatch-display-wrapper">
            <div class="stopwatch-ring-bg"></div>
            <div class="stopwatch-ring-glow" id="stopwatch-glow"></div>
            <div class="stopwatch-digits">
              <span id="sw-time">00:00.00</span>
            </div>
          </div>
          <div class="stopwatch-controls">
            <button id="sw-btn-start" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              開始
            </button>
            <button id="sw-btn-pause" class="btn btn-warning" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
              </svg>
              暫停
            </button>
            <button id="sw-btn-reset" class="btn btn-danger">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 2v6h6M21.5 22v-6h-6" />
                <path d="M22 11.5A10 10 0 0 0 3.2 7.2L2.5 8M2 12.5a10 10 0 0 0 18.8 4.3l.7-.8" />
              </svg>
              重設
            </button>
          </div>
          <div class="stopwatch-log-action">
            <button id="sw-btn-log" class="btn btn-success btn-block" disabled>
              使用此時間新增沖煮紀錄 (<span id="sw-logged-val">0.0</span>s)
            </button>
          </div>
        </section>

        <!-- Beans Inventory Section -->
        <section class="card inventory-card" aria-labelledby="beans-title">
          <div class="section-header-action">
            <h2 id="beans-title" class="section-title">咖啡豆庫存</h2>
            <button id="btn-add-bean" class="btn btn-secondary btn-sm">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              新增豆子
            </button>
          </div>
          
          <div class="bean-filters">
            <button class="filter-chip active" data-filter="active">現役中</button>
            <button class="filter-chip" data-filter="finished">已喝完</button>
            <button class="filter-chip" data-filter="all">全部</button>
          </div>

          <div id="bean-list" class="bean-list">
            <!-- Beans will be dynamicly rendered here -->
            <div class="empty-state">
              <p>目前沒有咖啡豆，請點擊「新增豆子」開始紀錄！</p>
            </div>
          </div>
        </section>
      </div>

      <!-- Right Column: Brew History -->
      <div class="main-column column-right">
        <section class="card history-card" aria-labelledby="history-title">
          <div class="section-header-action">
            <h2 id="history-title" class="section-title">沖煮歷史紀錄</h2>
            <button id="btn-add-log" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              記錄沖煮
            </button>
          </div>

          <!-- Filters -->
          <div class="history-controls">
            <div class="search-box">
              <input type="text" id="search-logs" placeholder="搜尋咖啡豆或備忘錄...">
              <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </div>
            <div class="filter-box">
              <select id="filter-bean-select">
                <option value="">所有咖啡豆</option>
                <!-- Dynamic bean options -->
              </select>
              <select id="filter-rating-select">
                <option value="">所有評分</option>
                <option value="5">5 星</option>
                <option value="4">4 星以上</option>
                <option value="3">3 星以上</option>
              </select>
            </div>
          </div>

          <div id="log-timeline" class="log-timeline">
            <!-- Brew logs will be dynamically rendered here -->
            <div class="empty-state">
              <p>尚無沖煮紀錄，點擊「記錄沖煮」寫下您的第一杯 Espresso！</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Dialog: Add/Edit Coffee Bean -->
  <dialog id="dialog-bean" class="custom-dialog">
    <form id="form-bean" method="dialog">
      <h2 id="dialog-bean-title">新增咖啡豆</h2>
      <input type="hidden" id="bean-id">
      
      <div class="form-group">
        <label for="bean-name">咖啡豆名稱 <span class="required">*</span></label>
        <input type="text" id="bean-name" required placeholder="例如：耶加雪菲 沃卡合作社">
      </div>
      
      <div class="form-group-row">
        <div class="form-group">
          <label for="bean-roaster">烘焙商</label>
          <input type="text" id="bean-roaster" placeholder="例如：Simple Kaffa">
        </div>
        <div class="form-group">
          <label for="bean-roast-level">烘焙度</label>
          <select id="bean-roast-level">
            <option value="light">淺焙 (Light)</option>
            <option value="medium" selected>中焙 (Medium)</option>
            <option value="medium-dark">中深焙 (Medium-Dark)</option>
            <option value="dark">深焙 (Dark)</option>
          </select>
        </div>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="bean-roast-date">烘焙日期</label>
          <input type="date" id="bean-roast-date">
        </div>
        <div class="form-group">
          <label for="bean-weight-initial">初始重量 (g)</label>
          <input type="number" id="bean-weight-initial" min="0" step="1" value="250">
        </div>
      </div>

      <div class="form-group">
        <label for="bean-notes">描述 / 備註</label>
        <textarea id="bean-notes" rows="3" placeholder="風味主調、處理法等資訊..."></textarea>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="btn-close-bean">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-save-bean">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: Add/Edit Brew Log -->
  <dialog id="dialog-log" class="custom-dialog">
    <form id="form-log" method="dialog">
      <h2 id="dialog-log-title">記錄沖煮</h2>
      <input type="hidden" id="log-id">
      
      <div class="form-group">
        <label for="log-bean-id">選擇咖啡豆 <span class="required">*</span></label>
        <select id="log-bean-id" required>
          <option value="" disabled selected>-- 請選擇咖啡豆 --</option>
          <!-- Active beans options -->
        </select>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="log-dose">粉量 (g) <span class="required">*</span></label>
          <input type="number" id="log-dose" min="0" max="50" step="0.1" value="18.0" required>
        </div>
        <div class="form-group">
          <label for="log-yield">液重 (g) <span class="required">*</span></label>
          <input type="number" id="log-yield" min="0" max="200" step="0.1" value="36.0" required>
        </div>
        <div class="form-group">
          <label for="log-time">萃取時間 (s) <span class="required">*</span></label>
          <input type="number" id="log-time" min="0" max="180" step="0.1" value="28.0" required>
        </div>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="log-grind">研磨度</label>
          <input type="text" id="log-grind" placeholder="例如：J-Ultra 1.3.5">
        </div>
        <div class="form-group">
          <label for="log-temp">水溫 (°C)</label>
          <input type="number" id="log-temp" min="50" max="110" step="0.5" value="93.0">
        </div>
        <div class="form-group">
          <label for="log-pressure">壓力 (bar)</label>
          <input type="number" id="log-pressure" min="0" max="20" step="0.5" value="9.0">
        </div>
      </div>

      <div class="form-group-row">
        <div class="form-group">
          <label for="log-preinfusion">預浸時間 (s)</label>
          <input type="number" id="log-preinfusion" min="0" max="60" step="0.5" value="0">
        </div>
        <div class="form-group">
          <label for="log-date">沖煮時間</label>
          <input type="datetime-local" id="log-date">
        </div>
      </div>

      <!-- Flavor Sliders -->
      <fieldset class="flavor-fieldset">
        <legend>風味平衡 (0-10)</legend>
        <div class="flavor-sliders">
          <div class="slider-group">
            <div class="slider-header">
              <span>酸度 (Acidity)</span>
              <span id="val-acidity">5</span>
            </div>
            <input type="range" id="log-acidity" min="0" max="10" step="1" value="5">
          </div>
          <div class="slider-group">
            <div class="slider-header">
              <span>甜度 (Sweetness)</span>
              <span id="val-sweetness">5</span>
            </div>
            <input type="range" id="log-sweetness" min="0" max="10" step="1" value="5">
          </div>
          <div class="slider-group">
            <div class="slider-header">
              <span>苦度 (Bitterness)</span>
              <span id="val-bitterness">5</span>
            </div>
            <input type="range" id="log-bitterness" min="0" max="10" step="1" value="5">
          </div>
          <div class="slider-group">
            <div class="slider-header">
              <span>醇厚度 (Body)</span>
              <span id="val-body">5</span>
            </div>
            <input type="range" id="log-body" min="0" max="10" step="1" value="5">
          </div>
        </div>
      </fieldset>

      <!-- Rating Selection -->
      <div class="form-group rating-form-group">
        <label>評分</label>
        <div class="star-rating-input" id="star-picker">
          <span class="star-btn" data-value="1">★</span>
          <span class="star-btn" data-value="2">★</span>
          <span class="star-btn" data-value="3">★</span>
          <span class="star-btn" data-value="4">★</span>
          <span class="star-btn" data-value="5">★</span>
        </div>
        <input type="hidden" id="log-rating" value="4">
      </div>

      <div class="form-group">
        <label for="log-notes">沖煮筆記 / 風味描述</label>
        <textarea id="log-notes" rows="3" placeholder="例如：前段柑橘酸，中段焦糖甜，餘韻黑巧克力。通道效應不明顯。"></textarea>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="log-deduct-stock" checked>
        <label for="log-deduct-stock">自動從咖啡豆庫存扣除此粉量</label>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="btn-close-log">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-save-log">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- Notification Toast -->
  <div id="toast" class="toast">提示訊息</div>

  <script src="app.js"></script>
</body>
</html>
